# pcqr_cub200_pcqr_static_qv
# dataset: cub200   arm: pcqr_static_qv
# Generated from the audited recipe cub200_qref_r4_seed1 by make_configs.py.
# Every key is self-contained: the training entry point reads one file and
# applies it wholesale, so nothing is inherited.
#
# bias_mask      qv = query+value bias slices (this work)
#                v  = value slice only (baseline)   bitfit = all biases
#                linear = no backbone bias          q/k/v_out/v_fc2 = slices
# context_rank   >0 enables the image-conditioned query residual and
#                REQUIRES visual_prompt/semantic_proxy to be off
# visual_prompt  shared visual prompts (VPT arm)
# semantic_proxy semantic-proxy branch (VPTSP arm)
